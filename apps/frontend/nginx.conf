# nginx-Konfiguration für das SchulAdmin-Frontend (Produktion)
# Liefert die SPA aus und leitet /api an das Backend weiter.
# Hinweis: TLS-Terminierung (HTTPS) sollte durch einen vorgelagerten
# Reverse-Proxy / Load-Balancer erfolgen (deployment-abhängig, offener Punkt).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Sicherheits-Header
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # API-Anfragen an das Backend weiterleiten
    location /api/ {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA-Fallback: alle übrigen Routen an index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
