# SchulToolKienast Backend – Railway
# Baut vom Monorepo-Root (Root Directory leer lassen)
# Alternative: Root Directory = apps/backend → dockerfilePath = "apps/backend/Dockerfile.prod"

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.prod"
watchPatterns = ["apps/backend/**"]

[deploy]
preDeployCommand = "npx prisma@5.7.1 migrate deploy"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
