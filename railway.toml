# Railway – SchulToolKienast Backend
# Root Directory im Dashboard: leer (Monorepo-Root) ODER apps/backend

[build]
builder = "RAILPACK"
watchPatterns = ["apps/backend/**"]

[deploy]
startCommand = "npm run start:prod --prefix apps/backend"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
