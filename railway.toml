# Railway – Backend (Root Directory im Dashboard: apps/backend)
# Befehle laufen bereits innerhalb von apps/backend.

[build]
builder = "RAILPACK"
buildCommand = "npm ci --ignore-scripts && npx prisma generate && npm run build"
watchPatterns = ["apps/backend/**"]

[deploy]
startCommand = "npx prisma migrate deploy && node dist/app.js"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
