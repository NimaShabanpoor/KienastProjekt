# Lokale Entwicklungsumgebung – SchulAdmin
# Startet MySQL, Backend und Frontend
version: "3.9"

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: schuladmin
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql://${DB_USER}:${DB_PASSWORD}@db:3306/schuladmin
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      NODE_ENV: development
      PORT: 3001
      FRONTEND_URL: ${FRONTEND_URL}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      TOTP_APP_NAME: ${TOTP_APP_NAME}
      TOTP_ISSUER: ${TOTP_ISSUER}
      ABSENCE_THRESHOLD: ${ABSENCE_THRESHOLD}
      LOG_LEVEL: ${LOG_LEVEL}
      LOG_FILE_PATH: ${LOG_FILE_PATH}
    ports:
      - "3001:3001"
    volumes:
      - ./apps/backend:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy
    command: npx ts-node-dev --respawn --transpile-only src/app.ts

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:3001
    ports:
      - "5173:5173"
    volumes:
      - ./apps/frontend:/app
      - ./packages/shared:/packages/shared
      - /app/node_modules
    command: npm run dev -- --host

volumes:
  mysql_data:
